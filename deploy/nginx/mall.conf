# ============================================================
#  mall-oymy 公网入口（Cloudflare Tunnel -> 本容器 -> 网关）
#  前端全部使用相对路径 /api/... ，所以只要同源反代到网关即可，
#  前端代码一行都不用改。
# ============================================================

# ---------- C 端商城：oymy-mall.online ----------
server {
    listen 80;
    server_name oymy-mall.online www.oymy-mall.online;

    root  /usr/share/nginx/html/c;
    index index.html;
    client_max_body_size 20m;

    # 网关（api / 支付回调 / AI 导购）
    location /api/ {
        proxy_pass http://gateway:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    # 上传的静态资源
    # 必须用 ^~ ：否则下面的正则 location ~* \.(png|jpg|...)$ 优先级更高，
    # 头像请求会被它截走并去 nginx 自己的 root 找文件，直接 404。
    location ^~ /uploads/ {
        proxy_pass http://gateway:9000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vue Router（history / hash 模式都兼容）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}

# ---------- B 端后台：admin.oymy-mall.online ----------
server {
    listen 80;
    server_name admin.oymy-mall.online;

    root  /usr/share/nginx/html/admin;
    index index.html;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://gateway:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /uploads/ {
        proxy_pass http://gateway:9000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
