# 管理端聚合服务配置
server:
  port: 9091
  # 网关 StripPrefix=2 后，请求到达时路径已无 /api 前缀
  # 例：前端 /api/admin/product → 网关剥离 /api/admin → 聚合服务收到 /product

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: mall-project-admin
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
        register-enabled: true
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.alibaba.nacos: WARN
    com.alibaba.nacos.client.naming: WARN
    com.alibaba.nacos.client.config: WARN

knife4j:
  enable: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: '管理端API'
      paths-to-match: '/**'
      packages-to-scan: com.mall.admin

# JWT 签名密钥（禁止硬编码）：由环境变量 JWT_SECRET 注入；本地默认值见 application-local.yaml
jwt:
  secret: ${JWT_SECRET:}
