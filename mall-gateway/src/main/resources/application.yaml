server:
  port: 9000

spring:
  application:
    name: mall-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: nacos
    gateway:
      # 全局跨域配置（统一在网关层处理，聚合服务不再各自配置 CORS）
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      # 路由规则：C端/B端流量隔离 + 支付回调专用路由
      routes:
        # ============ C 端流量 → mall-project (9090) ============
        - id: customer-api
          uri: lb://mall-project
          predicates:
            - Path=/api/c/**
          filters:
            - StripPrefix=2    # /api/c/users/login → /users/login

        # ============ B 端流量 → mall-project-admin (9091) ============
        - id: admin-api
          uri: lb://mall-project-admin
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=2    # /api/admin/product → /product

        # ============ 支付宝回调（公共路由，不经过鉴权） ============
        - id: payment-notify
          uri: lb://mall-project
          predicates:
            - Path=/api/payment/alipay/notify
          filters:
            - StripPrefix=1    # /api/payment/alipay/notify → /payment/alipay/notify

        # ============ 静态资源（上传文件访问） ============
        - id: uploads
          uri: lb://mall-project
          predicates:
            - Path=/uploads/**
