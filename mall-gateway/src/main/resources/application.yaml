server:
  port: 9000

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: mall-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
    gateway:
      # 全局跨域配置（统一在网关层处理，聚合服务不再各自配置 CORS）
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      # 路由规则：C端/B端流量隔离 + 支付回调专用路由
      routes:
        # ============ C 端流量 → mall-project (9090) ============
        - id: customer-api
          uri: lb://mall-project
          predicates:
            - Path=/api/c/**
          filters:
            - StripPrefix=2    # /api/c/users/login → /users/login

        # ============ B 端流量 → mall-project-admin (9091) ============
        - id: admin-api
          uri: lb://mall-project-admin
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=2    # /api/admin/product → /product

        # ============ 支付宝回调（公共路由，不经过鉴权） ============
        - id: payment-notify
          uri: lb://mall-project
          predicates:
            - Path=/api/payment/alipay/notify
          filters:
            - StripPrefix=1    # /api/payment/alipay/notify → /payment/alipay/notify

        # ============ 静态资源（上传文件访问） ============
        - id: uploads
          uri: lb://mall-project
          predicates:
            - Path=/uploads/**

        # ============ AI 导购（Python FastAPI） ============
        - id: ai-api
          uri: http://localhost:8095
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=2    # /api/ai/chat → /chat
          # 大模型回答本身就要十几到几十秒，不能用全局 30 秒超时把它掐掉
          metadata:
            response-timeout: 90s
            connect-timeout: 3000
      httpclient:
        # 默认没有响应超时：下游卡住时连接会一直挂着，这里设一个上限
        connect-timeout: 3000
        response-timeout: 30s

# JWT 签名密钥（禁止硬编码）：由环境变量 JWT_SECRET 注入；本地默认值见 application-local.yaml
jwt:
  secret: ${JWT_SECRET:}
