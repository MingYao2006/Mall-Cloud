server:
  port: 8089
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: mall-payment-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: localhost:8848
        file-extension: yaml
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: localhost:8080
        port: 8722
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: localhost:8848
            username: nacos
            password: ${NACOS_PASSWORD:nacos}
            data-id: ${spring.application.name}-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

knife4j:
  enable: true

# 开启 Feign 对 Sentinel 的支持
feign:
  sentinel:
    enabled: true

logging:
  level:
    com.mall.payment: debug

payment:
  wechat:
    app-id: your_wechat_appid
    mch-id: your_mch_id
    api-key: your_api_key
    notify-url: http://your-domain/api/payment/handleCallBack/wechat
    private-key-path: classpath:/cert/apiclient_key.pem
    cert-path: classpath:/cert/apiclient_cert.pem
  
  alipay:
    app-id: 9021000167605065
    private-key: ${ALIPAY_PRIVATE_KEY:}
    public-key: ${ALIPAY_PUBLIC_KEY:}
    alipay-public-key: ${ALIPAY_ALIPAY_PUBLIC_KEY:}
#    gateway-url: https://openapi.alipay.com/gateway.do
    gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
#    gateway-url: https://openapi.alipaydev.com/gateway.do
    notify-url: https://impulse-mammary-worst.ngrok-free.dev/api/payment/alipay/notify
    return-url:  http://localhost:8080/pay-result.html
