server:
  port: 8081

spring:
  application:
    name: mall-user-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: localhost:8848
        file-extension: yaml
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
        import-check:
          enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mall?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 微信小程序配置（用于 jscode2session 换取 openid）
# 真实 AppID/AppSecret 不入库：请放在 application-local.yaml（已被 .gitignore 忽略），
# 或通过环境变量 WX_APPID / WX_SECRET 提供
wechat:
  miniapp:
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
    # 微信接口地址，一般无需修改
    jscode2session-url: https://api.weixin.qq.com/sns/jscode2session

knife4j:
  enable: true

logging:
  level:
    com.mall.user: debug

# JWT 签名密钥（禁止硬编码）：由环境变量 JWT_SECRET 注入；本地默认值见 application-local.yaml
jwt:
  secret: ${JWT_SECRET:}

# 文件上传根目录（写入方：头像落盘到这里）
# 必须与 mall-Project 的 file.upload-dir 完全一致，否则文件写进去但映射不到、头像 404。
# 生产环境用 FILE_UPLOAD_DIR 指向挂载卷，见 deploy/docker-compose.yml
file:
  upload-dir: ${FILE_UPLOAD_DIR:D:/upload/mall/}
