# Redis 从节点1配置文件

# 网络配置
bind 0.0.0.0
port 6379

# 保护模式（生产环境建议设置为 yes，并配置密码）
protected-mode no

# 主从复制配置
replicaof redis-master 6379
replica-read-only yes

# 数据持久化配置
# RDB 持久化
save 900 1
save 300 10
save 60 10000

# AOF 持久化
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 日志配置
loglevel notice
logfile "/var/log/redis/redis.log"

# 数据目录
dir /data

# 最大内存设置（根据实际情况调整）
maxmemory 256mb
maxmemory-policy allkeys-lru

# 连接配置
timeout 0
tcp-keepalive 300

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 客户端连接数限制
maxclients 10000
