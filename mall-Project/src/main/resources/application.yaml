server:
  port: 9090
  # 网关 StripPrefix=2 后，请求到达时路径已无 /api 前缀
  # 例：前端 /api/c/users/login → 网关剥离 /api/c → 聚合服务收到 /users/login

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: mall-project
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
        register-enabled: true
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      host: localhost
      port: 6379
  # 文件上传大小限制（Spring Boot 默认单文件仅 1MB，图片上传容易超限报 MaxUploadSizeExceededException）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.alibaba.nacos: WARN
    com.alibaba.nacos.client.naming: WARN
    com.alibaba.nacos.client.config: WARN
    org.springframework.cloud.bootstrap: INFO

knife4j:
  enable: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: '商城API'
      paths-to-match: '/**'
      packages-to-scan: com.mall

# 支付宝沙箱支付配置
payment:
  alipay:
    app-id: 9021000167605065
    private-key: ${ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_ALIPAY_PUBLIC_KEY:}
    gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
    notify-url: http://localhost:9100/api/payment/alipay/notify
    return-url: http://localhost:3000/pay-result

# JWT 签名密钥（禁止硬编码）：由环境变量 JWT_SECRET 注入；本地默认值见 application-local.yaml
jwt:
  secret: ${JWT_SECRET:}

# 文件上传根目录（读取方：本服务的 /uploads/** 静态映射）
# 必须与 mall-user-service 的 file.upload-dir 完全一致，否则头像写入后无法访问。
# 生产环境用 FILE_UPLOAD_DIR 指向挂载卷，见 deploy/docker-compose.yml
file:
  upload-dir: ${FILE_UPLOAD_DIR:D:/upload/mall/}
