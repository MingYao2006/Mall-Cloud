server:
  port: 8088

spring:
  application:
    name: mall-seckill-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: localhost:8848
        file-extension: yml
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: localhost:8086
        port: 8720
      eager: true
      web-context-unify: true
      filter:
        enabled: true
        url-patterns: /**
      datasource:
        flow:
          nacos:
            server-addr: localhost:8848
            username: nacos
            password: ${NACOS_PASSWORD:nacos}
            data-id: ${spring.application.name}-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    # 投递成功/失败回调：没有它，Broker 落盘失败时生产者毫无察觉
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        # 消费失败重试 3 次；仍失败则 reject 且不重回队列，进入 seckill.dlq
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms

  amqp:
    deserialization:
      trust:
        all: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

knife4j:
  enable: true

# 开启 Feign 对 Sentinel 的支持
feign:
  sentinel:
    enabled: true

# 开启 Sentinel 对 Spring MVC 的支持
management:
  endpoints:
    web:
      exposure:
        include: '*'

logging:
  level:
    com.mall.seckill: debug