server:
  port: 8087

spring:
  application:
    name: mall-search-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: localhost:8848
        file-extension: yml
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
        import-check:
          enabled: false
  elasticsearch:
    uris: http://localhost:9200
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

knife4j:
  enable: true

logging:
  level:
    com.mall.search: debug