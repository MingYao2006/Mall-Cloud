server:
  port: 8083

spring:
  application:
    name: mall-product-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev,local}
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: nacos
      config:
        server-addr: localhost:8848
        file-extension: yml
        username: nacos
        password: nacos
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: localhost:8086
        port: 8721
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: localhost:8848
            username: nacos
            password: nacos
            data-id: ${spring.application.name}-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

knife4j:
  enable: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: '商品服务API'
      paths-to-match: '/**'
      packages-to-scan: com.mall.product.controller

# Swagger 文档信息配置
swagger:
  title: 商品服务API文档
  description: 商品服务接口文档，包含商品的增删改查、分类管理等功能
  version: 1.0.0
  contact:
    name: mingyao
    email: support@example.com
  license: Apache 2.0
  license-url: https://www.apache.org/licenses/LICENSE-2.0

# 开启 Feign 对 Sentinel 的支持
feign:
  sentinel:
    enabled: true

logging:
  level:
    com.mall.product: debug