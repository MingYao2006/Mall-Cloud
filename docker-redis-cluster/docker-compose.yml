services:
  # Redis 主节点
  redis-master:
    image: docker.m.daocloud.io/library/redis:7.2-alpine
    container_name: redis-master
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./redis-conf/master.conf:/etc/redis/redis.conf
      - ./redis-data/master:/data
    networks:
      - redis-cluster
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Redis 从节点 1
  redis-slave-1:
    image: docker.m.daocloud.io/library/redis:7.2-alpine
    container_name: redis-slave-1
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf
    ports:
      - "6380:6379"
    volumes:
      - ./redis-conf/slave-1.conf:/etc/redis/redis.conf
      - ./redis-data/slave-1:/data
    networks:
      - redis-cluster
    depends_on:
      - redis-master
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Redis 从节点 2
  redis-slave-2:
    image: docker.m.daocloud.io/library/redis:7.2-alpine
    container_name: redis-slave-2
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf
    ports:
      - "6381:6379"
    volumes:
      - ./redis-conf/slave-2.conf:/etc/redis/redis.conf
      - ./redis-data/slave-2:/data
    networks:
      - redis-cluster
    depends_on:
      - redis-master
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  redis-cluster:
    driver: bridge

volumes:
  redis-data: