server:
  port: 8085

spring:
  application:
    name: mall-order-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: localhost:8848
        file-extension: yml
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: localhost:8086
        port: 8720
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: localhost:8848
            username: nacos
            password: ${NACOS_PASSWORD:nacos}
            data-id: ${spring.application.name}-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    # 生产者侧确认： Broker 收不到消息时能在回调里发现，而不是发完就当成功
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 消费抛异常先本地重试 3 次；仍失败则 reject 且不再回到原队列，
        # 由队列的 x-dead-letter-exchange 投递到死信队列（否则毒消息会无限重投打满 CPU）
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          # 指数退避：1s -> 2s -> 4s，避免下游还没恢复就被密集重试继续打垮
          multiplier: 2
          max-interval: 30000ms
        default-requeue-rejected: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

knife4j:
  enable: true

# 开启 Feign 对 Sentinel 的支持
feign:
  sentinel:
    enabled: true

logging:
  level:
    com.mall.order: debug